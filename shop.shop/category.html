<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111214">
    <meta name="description" content="Browse products by category at NE-electronics.">
    <title>Product Category | NE-electronics</title>
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="category.css">
</head>
<body class="catalog-page category-page">
    <header class="site-header catalog-site-header">
        <div class="header-inner">
            <a class="brand" href="shop.html" aria-label="NE-electronics home">
                <span class="brand-mark" aria-hidden="true">N<span>E</span></span>
                <span>NE-electronics</span>
            </a>
            <a class="icon-link cart-link" href="cart.html" aria-label="Shopping cart">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5h2l2.2 11.1h10.8l2.1-7.8H6.3"></path><circle cx="9.5" cy="19.3" r="1"></circle><circle cx="17.5" cy="19.3" r="1"></circle></svg>
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>
    <main class="catalog-page-content">
        <header class="catalog-page-header">
            <a class="catalog-back-link" href="shop.html">← Back to homepage</a>
            <p class="eyebrow">Browse our collection</p>
            <h1 id="category-title">Product category</h1>
            <p class="catalog-description" id="category-description" aria-live="polite"></p>
        </header>
        <section aria-label="Products in this category">
            <div class="product-grid category-product-grid" id="category-product-grid"></div>
        </section>
    </main>
    <script src="pricing.js" defer></script>
    <script src="category.js" defer></script>
    <script src="cart.js" defer></script>
    <script src="product-descriptions.js" defer></script>
</body>
</html>
