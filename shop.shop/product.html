<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111214">
    <meta name="description" content="Browse all 40 phone accessories and everyday tech products from NE-electronics.">
    <title>All Products | NE-electronics</title>
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="product.css">
</head>
<body class="catalog-page product-catalog-page">
    <header class="site-header catalog-site-header">
        <div class="header-inner">
            <a class="brand" href="shop.html" aria-label="NE-electronics home">
                <span class="brand-mark" aria-hidden="true">N<span>E</span></span>
                <span>NE-electronics</span>
            </a>
            <a class="icon-link cart-link" href="cart.html" aria-label="Shopping cart">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5h2l2.2 11.1h10.8l2.1-7.8H6.3"></path><circle cx="9.5" cy="19.3" r="1"></circle><circle cx="17.5" cy="19.3" r="1"></circle></svg>
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>
    <main class="catalog-page-content">
        <header class="catalog-page-header">
            <a class="catalog-back-link" href="shop.html">← Back to homepage</a>
            <div class="product-catalog-heading">
                <div>
                    <p class="eyebrow">Made for your everyday</p>
                    <h1>All products</h1>
                    <p class="catalog-description">Browse all 40 products in our collection.</p>
                </div>
                <div class="product-upload">
                    <div class="product-upload-copy">
                        <h2>Add a product photo</h2>
                        <p>Choose an image to preview it in this gallery.</p>
                    </div>
                    <button class="product-upload-button" id="product-upload-button" type="button">＋ Add product photo</button>
                    <input class="product-file-input" id="product-file-input" type="file" accept="image/*" multiple>
                </div>
            </div>
        </header>
        <nav class="product-categories" aria-label="Filter products by category">
            <button class="category-filter is-active" type="button" data-category="all" aria-pressed="true">All products</button>
            <button class="category-filter" type="button" data-category="phone-cover" aria-pressed="false">Phone cover</button>
            <button class="category-filter" type="button" data-category="power-bank" aria-pressed="false">Power bank</button>
            <button class="category-filter" type="button" data-category="phone-holder" aria-pressed="false">Phone holder</button>
            <button class="category-filter" type="button" data-category="bluetooth" aria-pressed="false">Bluetooth</button>
            <button class="category-filter" type="button" data-category="camera-lens" aria-pressed="false">Camera lens</button>
            <button class="category-filter" type="button" data-category="earphones" aria-pressed="false">Earphones</button>
            <button class="category-filter" type="button" data-category="usb-and-charger" aria-pressed="false">USB &amp; charger</button>
        </nav>
        <p class="product-filter-status" id="product-filter-status" aria-live="polite">Showing all products.</p>
        <p class="product-upload-status" id="product-upload-status" aria-live="polite"></p>
        <div class="product-grid" aria-label="All products"></div>
    </main>
    <script src="pricing.js" defer></script>
    <script src="shop.js" defer></script>
    <script src="cart.js" defer></script>
    <script src="product-descriptions.js" defer></script>
</body>
</html>
