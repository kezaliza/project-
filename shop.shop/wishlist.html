<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6B7556">
    <meta name="description" content="View products saved to your NE-electronics wishlist.">
    <title>Your Wishlist | NE-electronics</title>
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="wishlist.css">
</head>
<body class="catalog-page wishlist-page">
    <header class="site-header catalog-site-header">
        <div class="header-inner">
            <a class="brand" href="shop.html" aria-label="NE-electronics home">
                <span class="brand-mark" aria-hidden="true">N<span>E</span></span>
                <span>NE-electronics</span>
            </a>
            <div class="header-actions">
                <a class="icon-link wishlist-link" href="wishlist.html" aria-label="Wishlist, 0 saved products" aria-current="page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.2-8.8 10.1-8.8 10.1S3.2 14 3.2 8.8a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z"></path></svg>
                    <span class="wishlist-count">0</span>
                </a>
                <a class="icon-link cart-link" href="cart.html" aria-label="Shopping cart">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5h2l2.2 11.1h10.8l2.1-7.8H6.3"></path><circle cx="9.5" cy="19.3" r="1"></circle><circle cx="17.5" cy="19.3" r="1"></circle></svg>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>
    <main class="wishlist-content">
        <a class="catalog-back-link" href="shop.html">← Continue shopping</a>
        <header class="wishlist-heading">
            <p class="eyebrow">Saved for later</p>
            <h1>Your wishlist</h1>
            <p>Products you save are kept here on this device.</p>
        </header>
        <section class="wishlist-grid product-grid" id="wishlist-items" aria-label="Saved products" aria-live="polite"></section>
    </main>
    <script src="pricing.js" defer></script>
    <script src="cart.js" defer></script>
    <script src="product-descriptions.js" defer></script>
</body>
</html>
